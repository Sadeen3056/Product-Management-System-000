<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - Product Management System</title>
    <!-- Link CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/all.min.css"> 
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-cart-shopping"></i>
            <div>
                <h1>Crud</h1>
                <p>Product Management System</p>
            </div>
        </div>

        <div class="header-badge">
            <i class="fa-solid fa-circle-dot"></i>
            <span>Stay Organized</span>
        </div>
    </header>


    <!-- Main Container -->
    <main>
        <!-- Product Form Section -->
        <section class="product-form">
            <h2>
                <i class="fa-solid fa-cube"></i>
                Add / Update Product
            </h2>

            <form id="productForm">
                <!-- Product Title -->
                <div class="input-group">
                    <i class="fa-solid fa-tag"></i>
                    <input type="text"id="title"placeholder="Title"autocomplete="off">
                </div>
                <!-- Price Information -->
                <div class="price-inputs">
                    <div class="input-group">
                        <i class="fa-solid fa-database"></i>
                        <input type="number"id="price"placeholder="Price">
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-percent"></i>
                        <input type="number"id="taxes"placeholder="Taxes">
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-bullhorn"></i>
                        <input type="number"id="ads"placeholder="Ads">
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-tag"></i>
                        <input type="number"id="discount"placeholder="Discount">
                    </div>
                </div>
                <!-- Total -->
                <div class="total-box" id="totalBox">
                    <div class="total-label">
                        <i class="fa-solid fa-calculator"></i>
                        <strong>Total:</strong>
                    </div>
                    <span id="total">0</span>
                </div>
                <!-- Count and Category -->
                <div class="product-details">
                    <div class="input-group">
                        <i class="fa-solid fa-cube"></i>
                        <input type="number"id="count"placeholder="Count"min="1">
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-tag"></i>
                        <input type="text"id="category"placeholder="Category"autocomplete="off">
                    </div>
                </div>
                <!-- Create / Update Button -->
                <button type="submit" id="submitBtn"><i class="fa-solid fa-plus"></i>Create</button>
            </form>
        </section>
        
        <!-- Products Table Section -->
        <section class="products-section">

            <!-- Search and Delete Controls -->
            <div class="table-controls">
                <div class="input-group search-input">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text"id="search"placeholder="Search..."autocomplete="off">
                </div>
                <button type="button" id="searchTitleBtn"><i class="fa-solid fa-font"></i>Search By Title</button>
                <button type="button" id="searchCategoryBtn"><i class="fa-solid fa-tag"></i>Search By Category</button>
                <button type="button" id="deleteAllBtn"><i class="fa-solid fa-trash-can"></i>Delete All (<span id="productsCount">0</span>)</button>
            </div>

            <!-- Products Table -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Price</th>
                            <th>Taxes</th>
                            <th>Ads</th>
                            <th>Discount</th>
                            <th>Total</th>
                            <th>Category</th>
                            <th>Update</th>
                            <th>Delete</th>
                        </tr>
                    </thead>

                    <tbody id="tbody">
                        <!-- Products will be displayed here using JavaScript -->
                    </tbody>
                </table>

                <!-- Empty State -->
                <div class="empty-state" id="emptyState">
                    <i class="fa-solid fa-cube"></i>
                    <h3>No products yet!</h3>
                    <p>Add your first product to get started.</p>
                </div>
            </div>
        </section>
        <!-- Link JS -->
    <script src="./script.js"></script>
    </main>

</body>

</html>
